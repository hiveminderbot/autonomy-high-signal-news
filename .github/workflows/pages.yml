name: Deploy Briefings to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'  # Daily at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare docs directory
        run: |
          mkdir -p docs
          # Copy the latest briefing HTML as the main index
          # Support both naming conventions: briefing_YYYY-MM-DD.html and briefing-high-signal-YYYY-MM-DD.html
          LATEST_BRIEFING=$(ls -1 output/briefing*.html 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_BRIEFING" ]; then
            cp "$LATEST_BRIEFING" docs/index.html
            echo "Deployed: $LATEST_BRIEFING -> docs/index.html"
          else
            echo "No briefing HTML found, creating placeholder"
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>High-Signal News</title></head><body><h1>High-Signal News Briefings</h1><p>No briefing available yet. Check back tomorrow.</p></body></html>' > docs/index.html
          fi
          # Also copy all historical briefings for archive
          cp output/briefing*.html docs/ 2>/dev/null || true
          # Copy latest.html as a stable URL
          cp output/latest.html docs/latest.html 2>/dev/null || true
          ls -la docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
