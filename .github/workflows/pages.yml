name: Deploy Briefings to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'  # Daily at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare docs directory
        run: |
          mkdir -p docs
          # Copy the latest briefing HTML as the main index.
          # Support both naming conventions and choose the newest date across them;
          # otherwise a stale briefing_YYYY-MM-DD file can hide a fresh high-signal
          # briefing-high-signal-YYYY-MM-DD artifact.
          LATEST_BRIEFING=$(python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = []
          for path in Path('output').glob('briefing*.html'):
              match = re.search(r'(\d{4}-\d{2}-\d{2})', path.name)
              if match:
                  candidates.append((match.group(1), path.name, path))
          if candidates:
              print(sorted(candidates)[-1][2])
          PY
          )
          if [ -n "$LATEST_BRIEFING" ]; then
            cp "$LATEST_BRIEFING" docs/index.html
            echo "Deployed: $LATEST_BRIEFING -> docs/index.html"
          else
            echo "No briefing HTML found, creating placeholder"
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>High-Signal News</title></head><body><h1>High-Signal News Briefings</h1><p>No briefing available yet. Check back tomorrow.</p></body></html>' > docs/index.html
          fi
          # Also copy all historical briefings for archive (both naming conventions)
          cp output/briefing_*.html docs/ 2>/dev/null || true
          cp output/briefing-high-signal-*.html docs/ 2>/dev/null || true
          # Copy latest.html as a stable URL
          cp output/latest.html docs/latest.html 2>/dev/null || true
          # Generate dark-themed dashboard from the newest non-empty markdown briefing across both naming conventions.
          LATEST_MD=$(python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = []
          for path in Path('output').glob('briefing*.md'):
              match = re.search(r'(\d{4}-\d{2}-\d{2})', path.name)
              if match:
                  size = path.stat().st_size
                  # Skip empty stub files (<= 10 bytes)
                  if size > 10:
                      candidates.append((match.group(1), path.name, path, size))
          if candidates:
              # Sort by date, pick the newest
              selected = sorted(candidates)[-1][2]
              print(selected)
          PY
          )
          if [ -n "$LATEST_MD" ] && [ -s "$LATEST_MD" ]; then
            python3 scripts/generate_dashboard.py "$LATEST_MD" docs/
            echo "Dashboard generated from $LATEST_MD"
          else
            echo "No valid markdown briefing for dashboard; skipping dashboard generation"
          fi
          ls -la docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
